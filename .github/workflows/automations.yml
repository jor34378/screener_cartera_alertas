name: Screener Cartera Telegram

on:
  schedule:
    # 11:07 hs Argentina (10:07 hs USA / 14:07 UTC)
    - cron: '7 14 * * 1-5'
    # 15:34 hs Argentina (14:34 hs USA / 18:34 UTC)
    - cron: '34 18 * * 1-5'
  # Permite ejecutarlo manualmente desde GitHub cuando quieras con un clic
  workflow_dispatch:

jobs:
  ejecutar-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Screener
        run: python screener.py
      - name: Guardar Historial de Alertas
        run: |
          git config --global user.name 'bot-screener'
          git config --global user.email 'bot@screener.com'
          git add alertas_enviadas.json || true
          git commit -m "Auto-update historial de alertas [skip ci]" || true
          git push || true
    
        

