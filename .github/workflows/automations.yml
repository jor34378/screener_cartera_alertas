name: Screener Cartera Telegram

on:
  schedule:
    # Horarios en UTC (Adaptado para días hábiles de Mercado US)
    # 13:30 UTC = Apertura Mercado (10:30 hs Argentina)
    - cron: '30 13 * * 1-5'
    # 17:00 UTC = Mitad de Rueda (14:00 hs Argentina)
    - cron: '0 17 * * 1-5'
    # 20:00 UTC = Cierre de Mercado (17:00 hs Argentina)
    - cron: '0 20 * * 1-5'
  
  # Permite ejecutarlo manualmente desde GitHub cuando quieras con un clic
  workflow_dispatch:

jobs:
  ejecutar-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Screener
        run: python screener.py
